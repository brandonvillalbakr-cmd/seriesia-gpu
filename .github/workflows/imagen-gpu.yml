# Construye la imagen del trabajador GPU (carpeta gpu/) y la sube a GitHub Container Registry.
# Se corre a mano (Actions → «Imagen GPU» → Run workflow) o al cambiar gpu/ en main.
name: Imagen GPU

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la imagen (ej. 0.1.0). Nunca latest."
        required: true
        default: "0.1.0"
  push:
    branches: [main]
    paths: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Liberar disco (la imagen base pesa ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Versión
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="0.1.${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Imagen: ghcr.io/${{ github.repository_owner }}/seriesia-gpu:$V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/seriesia-gpu:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
